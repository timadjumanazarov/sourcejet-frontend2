<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceJet AI — Cargo Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .ai-gradient-text {
            background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.15);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-purple-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-purple-900/30 bg-slate-900/60 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            
            <a href="index.html" class="flex items-center gap-3.5 hover:opacity-80 transition">
                <div class="w-11 h-11 bg-gradient-to-tr from-purple-600 via-indigo-600 to-cyan-400 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-xl shadow-purple-500/25">
                    ⚡
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="font-black text-xl tracking-wider text-white">SourceJet <span class="ai-gradient-text">AI</span></span>
                    </div>
                    <p class="text-[9px] text-purple-400/90 font-bold tracking-widest uppercase" data-i18n="header_sub">Global Trade & Sourcing Network</p>
                </div>
            </a>

            <nav class="hidden md:flex items-center gap-8 text-xs font-semibold uppercase tracking-wider text-slate-300">
                <a href="index.html" class="hover:text-purple-400 transition" data-i18n="nav_suppliers">Suppliers Hub</a>
                <a href="cargo_tracker.html" class="text-purple-400 transition font-bold" data-i18n="nav_tracking">Cargo Tracking</a>
            </nav>

            <div class="flex items-center gap-4">
                <div class="bg-slate-900 border border-purple-900/50 rounded-xl p-1 flex items-center gap-1 text-xs font-bold">
                    <button onclick="setLanguage('ru')" id="lang-ru" class="px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white">RU</button>
                    <button onclick="setLanguage('en')" id="lang-en" class="px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white">EN</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Tracker Content -->
    <main class="max-w-3xl mx-auto px-6 py-16 flex-1 w-full space-y-8">
        <div class="text-center space-y-3">
            <h1 class="text-3xl md:text-4xl font-black text-white tracking-tight" data-i18n="tracker_title">📦 Real-Time Cargo Tracking</h1>
            <p class="text-slate-400 text-sm" data-i18n="tracker_subtitle">Enter your tracking number to monitor supply chain checkpoints and status.</p>
        </div>

        <div class="glass-panel p-6 rounded-3xl space-y-4 shadow-2xl">
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="trackingInput" value="SJ-88492-CN" 
                    data-i18n-placeholder="tracker_placeholder"
                    placeholder="Enter tracking number..." 
                    class="flex-1 bg-slate-950/90 border border-purple-900/60 rounded-2xl px-5 py-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 text-sm font-mono tracking-wide transition">
                <button onclick="trackShipment()" 
                    class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-95 text-white font-bold px-8 py-4 rounded-2xl text-xs uppercase tracking-wider transition shadow-lg shadow-purple-600/30" data-i18n="btn_track">
                    Track Cargo
                </button>
            </div>

            <div id="resultContainer" class="hidden space-y-6 border-t border-purple-950 pt-6 mt-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-slate-950/60 p-4 rounded-2xl border border-purple-900/30">
                        <span class="text-[10px] uppercase font-bold text-slate-500 block mb-1" data-i18n="status_label">Status</span>
                        <span id="shipmentStatus" class="inline-block px-3 py-1 bg-cyan-950 text-cyan-400 border border-cyan-800/50 rounded-full text-xs font-bold uppercase tracking-wider"></span>
                    </div>
                    <div class="bg-slate-950/60 p-4 rounded-2xl border border-purple-900/30">
                        <span class="text-[10px] uppercase font-bold text-slate-500 block mb-1" data-i18n="route_label">Route</span>
                        <span id="shipmentRoute" class="font-bold text-white text-sm"></span>
                    </div>
