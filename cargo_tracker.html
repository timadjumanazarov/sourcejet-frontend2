<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceJet - Трекинг грузов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем официальную библиотеку Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold mb-2 text-center">📦 Отслеживание груза</h1>
        <p class="text-slate-400 text-sm mb-6 text-center">Введите трек-номер для проверки статуса (например: <code class="text-cyan-400">SJ-88492-CN</code>)</p>

        <div class="flex gap-2 mb-6">
            <input type="text" id="trackingInput" placeholder="SJ-88492-CN" value="SJ-88492-CN"
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500">
            <button onclick="trackShipment()" 
                class="bg-cyan-600 hover:bg-cyan-500 px-5 py-2.5 rounded-xl font-medium transition">
                Найти
            </button>
        </div>

        <div id="resultContainer" class="hidden space-y-4 border-t border-slate-800 pt-4">
            <div class="flex justify-between items-center">
                <span class="text-slate-400 text-sm">Статус:</span>
                <span id="shipmentStatus" class="px-3 py-1 bg-cyan-950 text-cyan-400 rounded-full text-xs font-semibold"></span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-slate-400 text-sm">Маршрут:</span>
                <span id="shipmentRoute" class="text-sm font-medium"></span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-slate-400 text-sm">Текущая точка:</span>
                <span id="shipmentLocation" class="text-sm font-medium text-cyan-300"></span>
            </div>

            <div class="mt-4">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">История перемещений</h3>
                <div id="eventsList" class="space-y-3 border-l-2 border-slate-800 pl-4 ml-2">
                    <!-- События подгрузятся динамически -->
                </div>
            </div>
        </div>

        <div id="errorContainer" class="hidden text-red-400 text-sm text-center bg-red-950/50 border border-red-900 p-3 rounded-xl">
            Груз не найден. Проверьте правильность трек-номера.
        </div>
    </div>

    <script>
        // Инициализация Supabase клиента
        const SUPABASE_URL = 'https://ozpskokidbhqtoeykyzf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Zpkfm-iDWB7WuHrAp1jDtQ_1w_QU8s0';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function trackShipment() {
            const trackingNumber = document.getElementById('trackingInput').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const errorContainer = document.getElementById('errorContainer');
            
            resultContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');

            if (!trackingNumber) return;

            // 1. Ищем груз в таблице shipments
            const { data: shipment, error } = await supabaseClient
                .from('shipments')
                .select('*')
                .eq('tracking_number', trackingNumber)
                .single();

            if (error || !shipment) {
                errorContainer.classList.remove('hidden');
                return;
            }

            // Заполняем данные на экране
            document.getElementById('shipmentStatus').innerText = shipment.status;
            document.getElementById('shipmentRoute').innerText = `${shipment.origin} ➔ ${shipment.destination}`;
            document.getElementById('shipmentLocation').innerText = shipment.current_location || 'В пути';

            // 2. Загружаем историю событий для этого груза
            const { data: events } = await supabaseClient
                .from('shipment_events')
                .select('*')
                .eq('shipment_id', shipment.id)
                .order('event_timestamp', { ascending: true });

            const eventsList = document.getElementById('eventsList');
            eventsList.innerHTML = '';

            if (events && events.length > 0) {
                events.forEach(ev => {
                    const dateStr = new Date(ev.event_timestamp).toLocaleDateString('ru-RU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    eventsList.innerHTML += `
                        <div class="relative">
                            <div class="absolute -left-[21px] top-1 w-2.5 h-2.5 bg-cyan-500 rounded-full ring-4 ring-slate-900"></div>
                            <p class="text-sm font-medium text-slate-200">${ev.title}</p>
                            <p class="text-xs text-slate-500">${ev.location} • ${dateStr}</p>
                        </div>
                    `;
                });
            }

            resultContainer.classList.remove('hidden');
        }

        // Автоматически запускаем поиск тестового груза при открытии страницы
        window.onload = () => {
            trackShipment();
        };
    </script>
</body>
</html>
