<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceJet - Поиск фабрик B2B</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Шапка -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-cyan-400">🏭 SourceJet AI Sourcing</h1>
                <p class="text-xs text-slate-400 mt-1">База верифицированных производителей Китая</p>
            </div>
            <a href="cargo_tracker.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg transition text-slate-300">📦 Трекинг грузов ➔</a>
        </div>

        <!-- Поиск и фильтры -->
        <div class="space-y-3">
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Введите название или город (например: Нинбо, Иу)..." 
                    class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-cyan-500 transition">
                
                <select id="categorySelect" onchange="applyFilters()" 
                    class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-slate-300 focus:outline-none focus:border-cyan-500">
                    <option value="ALL">Все категории</option>
                    <option value="Электроника">Электроника</option>
                    <option value="Текстиль">Текстиль</option>
                    <option value="Упаковка">Упаковка</option>
                </select>
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 px-1">
                <span id="resultsCount">Загрузка данных...</span>
                <button onclick="resetFilters()" class="text-cyan-400 hover:underline">Сбросить фильтры</button>
            </div>
        </div>

        <!-- Список фабрик -->
        <div id="suppliersGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ozpskokidbhqtoeykyzf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Zpkfm-iDWB7WuHrAp1jDtQ_1w_QU8s0';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allSuppliers = [];

        async function fetchSuppliers() {
            const grid = document.getElementById('suppliersGrid');
            const countLabel = document.getElementById('resultsCount');
            
            grid.innerHTML = '<p class="text-slate-500 col-span-2 text-center py-8">Загрузка с базы Supabase...</p>';

            const { data, error } = await supabaseClient
                .from('suppliers')
                .select('*');

            if (error) {
                console.error("Ошибка Supabase:", error);
                grid.innerHTML = `<p class="text-red-400 col-span-2 text-center py-8">Ошибка базы данных: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<p class="text-yellow-400 col-span-2 text-center py-8">Таблица suppliers пуста! Добавьте тестовые строки в Supabase.</p>';
                return;
            }

            allSuppliers = data;
            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const category = document.getElementById('categorySelect').value;
            const grid = document.getElementById('suppliersGrid');
            const countLabel = document.getElementById('resultsCount');

            const filtered = allSuppliers.filter(s => {
                const sCategory = s.category ? String(s.category).trim() : '';
                const sName = s.name ? String(s.name).toLowerCase() : '';
                const sLocation = s.location ? String(s.location).toLowerCase() : '';

                const matchesCategory = (category === 'ALL') || (sCategory === category);
                const matchesSearch = !search || sName.includes(search) || sLocation.includes(search);
                
                return matchesCategory && matchesSearch;
            });

            countLabel.innerText = `Найдено производителей: ${filtered.length} из ${allSuppliers.length}`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-2 text-center py-12 bg-slate-900/50 border border-slate-800 rounded-2xl">
                        <p class="text-slate-400 font-medium">Ничего не найдено по вашему запросу</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';
            filtered.forEach(s => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 p-5 rounded-2xl space-y-3 transition">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-lg text-white">${s.name}</h3>
                                <p class="text-xs text-slate-400">📍 ${s.location}</p>
                            </div>
                            ${s.verified ? '<span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800/50 px-2.5 py-1 rounded-full font-medium">Verified</span>' : ''}
                        </div>
                        <div class="flex gap-4 text-xs text-slate-300 pt-2 border-t border-slate-800">
                            <div><span class="text-slate-500">Категория:</span> <strong class="text-cyan-400">${s.category}</strong></div>
                            <div><span class="text-slate-500">MOQ:</span> ${s.moq}</div>
                            <div><span class="text-slate-500">Рейтинг:</span> ⭐ ${s.rating}</div>
                        </div>
                        <button class="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-xs py-2.5 rounded-xl font-medium transition text-cyan-400">
                            Запросить КП / Образцы
                        </button>
                    </div>
                `;
            });
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categorySelect').value = 'ALL';
            applyFilters();
        }

        window.onload = fetchSuppliers;
    </script>
</body>
</html>
