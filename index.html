<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceJet AI — Global Sourcing & Trade Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .ai-gradient-text {
            background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.18);
        }
        @keyframes barGrow {
            0% { height: 20%; }
            50% { height: 95%; }
            100% { height: 20%; }
        }
        .animate-bar-1 { animation: barGrow 3s ease-in-out infinite; }
        .animate-bar-2 { animation: barGrow 4s ease-in-out infinite 0.5s; }
        .animate-bar-3 { animation: barGrow 2.5s ease-in-out infinite 1s; }
        .animate-bar-4 { animation: barGrow 3.5s ease-in-out infinite 0.2s; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-purple-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-purple-900/30 bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            
            <div class="flex items-center gap-3.5">
                <div class="w-11 h-11 bg-gradient-to-tr from-purple-600 via-indigo-600 to-cyan-400 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-xl shadow-purple-500/25">
                    ⚡
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="font-black text-xl tracking-wider text-white">SourceJet <span class="ai-gradient-text">AI</span></span>
                    </div>
                    <p class="text-[9px] text-purple-400/90 font-bold tracking-widest uppercase">Global Sourcing & Trade Network</p>
                </div>
            </div>

            <nav class="hidden md:flex items-center gap-6 text-xs font-semibold uppercase tracking-wider text-slate-300">
                <a href="#search-section" class="hover:text-purple-400 transition" data-ru="Поиск фабрик" data-en="Suppliers Hub">Поиск фабрик</a>
                <a href="cargo_tracker.html" class="hover:text-purple-400 transition" data-ru="Трекинг грузов" data-en="Cargo Tracking">Трекинг грузов</a>
                <a href="#analytics" class="hover:text-purple-400 transition" data-ru="Аналитика цен" data-en="AI Analytics">Аналитика цен</a>
                
                <a href="inspector_dashboard.html" class="hover:text-purple-400 transition flex items-center gap-1">
                    <span data-ru="База инспекторов" data-en="Inspectors Network">База инспекторов</span>
                    <span class="text-[7px] bg-purple-950 text-purple-300 border border-purple-800 px-1.5 py-0.5 rounded-full font-bold -translate-y-1">GLOBAL</span>
                </a>

                <a href="importer_dashboard.html" class="hover:text-purple-400 transition text-cyan-300 font-bold" data-ru="Кабинет импортера" data-en="Importer Portal">Кабинет импортера</a>
            </nav>

            <div class="flex items-center gap-4">
                <div class="bg-slate-900 border border-purple-900/50 rounded-xl p-1 flex items-center gap-1 text-xs font-bold">
                    <button onclick="switchLanguage('ru')" id="btn-ru" class="px-2.5 py-1 rounded-lg transition bg-purple-600 text-white">RU</button>
                    <button onclick="switchLanguage('en')" id="btn-en" class="px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white">EN</button>
                </div>
                <button onclick="window.location.href='inspection_request.html'" class="hidden sm:inline-block bg-gradient-to-r from-purple-600 to-cyan-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs uppercase transition shadow-lg shadow-purple-600/30 hover:opacity-90 text-center leading-normal cursor-pointer" data-ru="Заказать инспекцию" data-en="Request Inspection">
                    Заказать инспекцию
                </button>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="py-12 px-6 text-center max-w-4xl mx-auto space-y-6">
        <div class="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-purple-950/80 border border-purple-800/60 text-purple-300 text-xs font-semibold backdrop-blur-md shadow-inner">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
            <span class="tracking-wide uppercase text-[10px] font-bold" data-ru="Интеллектуальная B2B Экосистема Торговли" data-en="Enterprise Sourcing & Trade Intelligence">Интеллектуальная B2B Экосистема Торговли</span>
        </div>

        <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight leading-tight">
            <span data-ru="Поиск поставщиков и аудит фабрик" data-en="Next-Gen AI Sourcing & Verification">Поиск поставщиков и аудит фабрик</span> <br>
            <span class="ai-gradient-text" data-ru="для глобального бизнеса" data-en="for Global Trade Ecosystems">для глобального бизнеса</span>
        </h1>
        <p class="text-slate-40
