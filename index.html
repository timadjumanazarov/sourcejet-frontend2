<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceJet - Поиск фабрик B2B</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Шапка -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-cyan-400">🏭 SourceJet AI Sourcing</h1>
                <p class="text-xs text-slate-400 mt-1">База верифицированных производителей Китая</p>
            </div>
            <a href="cargo_tracker.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg transition text-slate-300">📦 Трекинг грузов ➔</a>
        </div>

        <!-- Поиск и фильтры -->
        <div class="space-y-3">
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Введите название или город (например: Нинбо, Иу)..." 
                    class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-cyan-500 transition">
                
                <select id="categorySelect" onchange="applyFilters()" 
                    class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-slate-300 focus:outline-none focus:border-cyan-500">
                    <option value="ALL">Все категории</option>
                    <option value="Электроника">Электроника</option>
                    <option value="Текстиль">Текстиль</option>
                    <option value="Упаковка">Упаковка</option>
                </select>
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 px-1">
                <span id="resultsCount">Загрузка данных из Supabase...</span>
                <button onclick="resetFilters()" class="text-cyan-400 hover:underline">Сбросить фильтры</button>
            </div>
        </div>

        <!-- Список фабрик -->
        <div id="suppliersGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ozpskokidbhqtoeykyzf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Zpkfm-iDWB7WuHrAp1jDtQ_1w_QU8s0';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allSuppliers = [];

        async function fetchSuppliers() {
            const grid = document.getElementById('suppliersGrid');
            const { data, error } = await supabaseClient.from('suppliers').select('*');

            if (error || !data) {
                grid.innerHTML = `<p class="text-red-400 col-span-3 text-center py-8">Ошибка связи с базой данных.</p>`;
                return;
            }

            allSuppliers = data;
            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const category = document.getElementById('categorySelect').value;
            const grid = document.getElementById('suppliersGrid');
            const countLabel = document.getElementById('resultsCount');

            const filtered = allSuppliers.filter(s => {
                const sCat = s.category ? String(s.category) : '';
                const sName = s.name ? String(s.name).toLowerCase() : '';
                const sLoc = s.location ? String(s.location).toLowerCase() : '';

                const matchesCategory = (category === 'ALL') || (sCat === category);
                const matchesSearch = !search || sName.includes(search) || sLoc.includes(search) || sCat.toLowerCase().includes(search);

                return matchesCategory && matchesSearch;
            });

            countLabel.innerText = `Отображается заводов: ${filtered.length} из ${allSuppliers.length}`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-12 text-slate-500 bg-slate-900/50 rounded-2xl border border-slate-800">Заводы не найдены.</div>`;
                return;
            }

            grid.innerHTML = '';
            filtered.forEach(s => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 p-5 rounded-2xl flex flex-col justify-between space-y-4 transition">
                        <div class="space-y-3">
                            <div class="flex justify-between items-start gap-2">
                                <h3 class="font-bold text-base text-white leading-snug">${s.name}</h3>
                                ${s.verified ? '<span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800/50 px-2 py-0.5 rounded-full shrink-0 font-medium">Verified</span>' : ''}
                            </div>
                            <p class="text-xs text-slate-400">📍 ${s.location}</p>
                            
                            <div class="space-y-1 text-xs text-slate-300 pt-2 border-t border-slate-800">
                                <div class="flex justify-between"><span class="text-slate-500">Категория:</span> <strong class="text-cyan-400">${s.category}</strong></div>
                                <div class="flex justify-between"><span class="text-slate-500">MOQ:</span> <span>${s.moq}</span></div>
                                <div class="flex justify-between"><span class="text-slate-500">Рейтинг:</span> <span>⭐ ${s.rating}</span></div>
                            </div>
                        </div>

                        <button onclick="alert('Заявка на инспекцию для ${s.name} успешно отправлена!')" 
                            class="w-full bg-cyan-600/10 hover:bg-cyan-600 border border-cyan-500/30 hover:border-transparent text-cyan-400 hover:text-white text-xs py-2.5 rounded-xl font-medium transition">
                            Заказать инспекцию
                        </button>
                    </div>
                `;
            });
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categorySelect').value = 'ALL';
            applyFilters();
        }

        window.onload = fetchSuppliers;
    </script>
</body>
</html>
    </script>
</body>
</html>
