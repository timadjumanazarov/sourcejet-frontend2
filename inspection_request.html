<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказать инспекцию фабрики — SourceJet AI</title>
    <!-- Фавиконка на вкладку браузера в виде векторного SVG-логотипа -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='sj-bg' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop stop-color='%236D28D9'/%3E%3Cstop offset='.55' stop-color='%234338CA'/%3E%3Cstop offset='1' stop-color='%230EA5E9'/%3E%3C/linearGradient%3E%3ClinearGradient id='sj-ribbon' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop stop-color='%23818CF8'/%3E%3Cstop offset='.5' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%2367E8F9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='19' fill='url(%23sj-bg)'/%3E%3Cpath d='M13 34C13 23 32 16 51 13 L35 27C29 31 21 32 13 34Z' fill='url(%23sj-ribbon)'/%3E%3Cpath d='M13 34C19 29 29 29 38 31 C47 33 51 37 48 42 C40 37 26 41 18 38 C15 37 13 36 13 34Z' fill='%2360A5FA'/%3E%3Cpath d='M48 40C47 47 29 53 12 56 L29 43C35 39 43 39 48 40Z' fill='url(%23sj-ribbon)'/%3E%3Cpath d='M46 15C49 12 53 12 54 14 C54 17 49 21 46 21 C43 21 43 18 46 15Z' fill='%2310B981'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .ai-gradient-text {
            background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.18);
        }

        /* Стили фирменного логотипа бренда */
        .sj-brand {
          display: inline-flex;
          align-items: center;
          gap: 16px;
          color: #fff;
          text-decoration: none;
        }

        .sj-brand__icon {
          display: block;
          width: 54px;
          height: 54px;
          flex-shrink: 0;
        }

        .sj-brand__copy {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }

        .sj-brand__name {
          font-weight: 900;
          font-size: 1.25rem;
          letter-spacing: 0.05em;
          color: #fff;
          line-height: 1;
        }

        .sj-brand__name span {
          background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #22d3ee 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .sj-brand__tagline {
          font-size: 8px;
          font-weight: 700;
          letter-spacing: 0.15em;
          color: #a855f7;
          line-height: 1.2;
          text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-purple-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-purple-900/30 bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            
            <!-- Бренд-блок с вектором логотипа -->
            <a class="sj-brand" href="index.html" aria-label="SourceJet AI — главная">
              <svg
                class="sj-brand__icon"
                viewBox="0 0 64 64"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
              >
                <defs>
                  <linearGradient id="sj-bg" x1="0" y1="1" x2="1" y2="0">
                    <stop stop-color="#6D28D9"/>
                    <stop offset=".55" stop-color="#4338CA"/>
                    <stop offset="1" stop-color="#0EA5E9"/>
                  </linearGradient>

                  <linearGradient id="sj-ribbon" x1="0" y1="1" x2="1" y2="0">
                    <stop stop-color="#818CF8"/>
                    <stop offset=".5" stop-color="#3B82F6"/>
                    <stop offset="1" stop-color="#67E8F9"/>
                  </linearGradient>
                </defs>

                <rect width="64" height="64" rx="19" fill="url(#sj-bg)"/>

                <path
                  d="M13 34C13 23 32 16 51 13
                     L35 27C29 31 21 32 13 34Z"
                  fill="url(#sj-ribbon)"
                />

                <path
                  d="M13 34C19 29 29 29 38 31
                     C47 33 51 37 48 42
                     C40 37 26 41 18 38
                     C15 37 13 36 13 34Z"
                  fill="#60A5FA"
                />

                <path
                  d="M48 40C47 47 29 53 12 56
                     L29 43C35 39 43 39 48 40Z"
                  fill="url(#sj-ribbon)"
                />

                <path
                  d="M46 15C49 12 53 12 54 14
                     C54 17 49 21 46 21
                     C43 21 43 18 46 15Z"
                  fill="#10B981"
                />
              </svg>

              <span class="sj-brand__copy">
                <span class="sj-brand__name">
                  SourceJet <span>AI</span>
                </span>

                <span class="sj-brand__tagline">
                  Factory Inspection Hub
                </span>
              </span>
            </a>

            <div class="flex items-center gap-4">
                <a href="importer_dashboard.html" class="text-xs text-cyan-300 font-bold hover:underline" data-ru="Кабинет импортера" data-en="Importer Portal">Кабинет импортера</a>
                <div class="bg-slate-900 border border-purple-900/50 rounded-xl p-1 flex items-center gap-1 text-xs font-bold">
                    <button onclick="switchLang('ru')" id="lang-ru" class="px-2.5 py-1 rounded-lg transition bg-purple-600 text-white cursor-pointer">RU</button>
                    <button onclick="switchLang('en')" id="lang-en" class="px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white cursor-pointer">EN</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Form Container -->
    <main class="max-w-3xl mx-auto px-6 py-12 flex-1 w-full space-y-8">
        <div class="text-center space-y-3">
            <h1 class="text-3xl md:text-4xl font-black text-white" data-ru="Заказать инспекцию товара на фабрике" data-en="Book Factory Quality Inspection">Заказать инспекцию товара на фабрике</h1>
            <p class="text-slate-400 text-sm" data-ru="Заявка автоматически поступит инспекторам в нужном городе для экономии логистических расходов." data-en="The request will be automatically routed to local inspectors in the selected region.">
                Заявка автоматически поступит инспекторам в нужном городе для экономии логистических расходов.
            </p>
        </div>

        <form id="inspectionForm" class="glass-panel p-6 md:p-8 rounded-3xl border border-purple-900/50 space-y-6 shadow-2xl">
            
            <!-- Client & Factory info -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-purple-300" data-ru="Ваше имя / Компания" data-en="Your Name / Company">Ваше имя / Компания</label>
                    <input type="text" id="client_name" required placeholder="ООО «Трейд Групп»" class="w-full bg-slate-950/90 border border-purple-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-purple-300" data-ru="Название фабрики" data-en="Factory Name">Название фабрики</label>
                    <input type="text" id="factory_name" required placeholder="Zhejiang Manufacturing Co." class="w-full bg-slate-950/90 border border-purple-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <!-- Country & Smart City Selector -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-purple-300" data-ru="Страна производства" data-en="Manufacturing Country">Страна производства</label>
                    <select id="country" class="w-full bg-slate-950/90 border border-purple-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                        <option value="China">Китай (China)</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-purple-300" data-ru="Город / Промышленный хаб" data-en="City / Industrial Hub">Город / Промышленный хаб</label>
                    <select id="city" class="w-full bg-slate-950/90 border border-purple-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                        <!-- Заполняется динамически -->
                    </select>
                </div>
            </div>

            <!-- Address and Date -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-purple-300" data-ru="Адрес фабрики (на местном/английском)" data-en="Factory Address (Local/English)">Адрес фабрики</label>
                    <input type="text" id="address_chinese" required placeholder="No. 188 Industry Road, Yiwu" class="w-full bg-slate-950/90 border border-purple-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-purple-300" data-ru="Желаемая дата инспекции" data-en="Desired Inspection Date">Желаемая дата инспекции</label>
                    <input type="date" id="scheduled_date" required class="w-full bg-slate-950/90 border border-purple-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <!-- Inspection Type -->
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-wider text-purple-300" data-ru="Тип инспекции" data-en="Inspection Type">Тип инспекции</label>
                <select id="inspection_type" class="w-full bg-slate-950/90 border border-purple-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                    <option value="PSI" data-ru="PSI (Финальная проверка перед отгрузкой)" data-en="PSI (Pre-Shipment Inspection)">PSI (Финальная проверка перед отгрузкой)</option>
                    <option value="DUPRO" data-ru="DUPRO (Проверка в процессе производства)" data-en="DUPRO (During Production Inspection)">DUPRO (Проверка в процессе производства)</option>
                    <option value="Loading" data-ru="Loading Supervision (Контроль погрузки в контейнер)" data-en="Container Loading Supervision">Loading Supervision (Контроль погрузки в контейнер)</option>
                </select>
            </div>

            <!-- Specific Requirements / Checklist notes -->
            <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-wider text-purple-300" data-ru="Техническое задание и требования к проверке" data-en="Technical Requirements & Notes">ТЗ и особые требования</label>
                <textarea id="requirements_notes" rows="4" placeholder="Опишите требования к товару, критичные дефекты, параметры упаковки..." class="w-full bg-slate-950/90 border border-purple-900/60 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-cyan-500 text-white font-bold py-4 rounded-2xl text-xs uppercase tracking-wider transition hover:opacity-90 shadow-lg shadow-purple-600/30 cursor-pointer">
                <span data-ru="Отправить заявку местным инспекторам" data-en="Dispatch Request to Local Inspectors">Отправить заявку местным инспекторам</span>
            </button>

            <div id="formStatus" class="text-center text-xs font-mono"></div>
        </form>
    </main>

    <footer class="border-t border-purple-900/30 bg-slate-900/80 py-8 text-center text-xs text-slate-500">
        <p>© 2026 SourceJet AI. Global Sourcing & Logistics Network.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://ozpskokidbhqtoeykyzf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Zpkfm-iDWB7WuHrAp1jDtQ_1w_QU8s0';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentLang = localStorage.getItem('sourcejet_lang') || 'ru';

        const citiesData = {
            China: ['Yiwu', 'Guangzhou', 'Shenzhen', 'Foshan', 'Ningbo', 'Hangzhou', 'Shanghai', 'Qingdao']
        };

        function updateCities() {
            const citySelect = document.getElementById('city');
            citySelect.innerHTML = '';
            
            citiesData.China.forEach(city => {
                const opt = document.createElement('option');
                opt.value = city;
                opt.textContent = city;
                citySelect.appendChild(opt);
            });
        }
        
        function switchLang(lang) {
            currentLang = lang;
            localStorage.setItem('sourcejet_lang', lang);

            document.getElementById('lang-ru').className = lang === 'ru' ? 'px-2.5 py-1 rounded-lg transition bg-purple-600 text-white font-bold cursor-pointer' : 'px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white cursor-pointer';
            document.getElementById('lang-en').className = lang === 'en' ? 'px-2.5 py-1 rounded-lg transition bg-purple-600 text-white font-bold cursor-pointer' : 'px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white cursor-pointer';

            document.querySelectorAll('[data-ru]').forEach(el => {
                const text = el.getAttribute(`data-${lang}`);
                if (text) el.innerText = text;
            });
        }

        document.getElementById('inspectionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('formStatus');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerText = currentLang === 'ru' ? 'Отправка в систему...' : 'Dispatching...';
            statusDiv.className = 'text-center text-xs font-mono text-purple-400';
            statusDiv.innerText = currentLang === 'ru' ? 'Маршрутизация заявки локальным инспекторам...' : 'Routing to local inspectors...';

            const clientNameVal = document.getElementById('client_name').value.trim();
            const factoryVal = document.getElementById('factory_name').value.trim();
            const notesVal = document.getElementById('requirements_notes').value.trim();
            const inspectionTypeVal = document.getElementById('inspection_type').value;
            const countryVal = document.getElementById('country').value;
            const cityVal = document.getElementById('city').value;

            const payload = {
                client_name: clientNameVal,
                factory_name: factoryVal,
                product_name: notesVal ? `${notesVal} (${inspectionTypeVal})` : `Инспекция фабрики (${inspectionTypeVal})`,
                country: countryVal,
                city: cityVal,
                address_chinese: document.getElementById('address_chinese').value.trim(),
                inspection_type: inspectionTypeVal,
                scheduled_date: document.getElementById('scheduled_date').value,
                status: 'new',
                escrow_status: 'held',
                dispute_deadline: new Date(Date.now() + 48*3600*1000).toISOString(),
                requirements: {
                    notes: notesVal
                }
            };

            // 1. Сохранение в Supabase
            const { data, error } = await supabaseClient
                .from('inspections')
                .insert([payload])
                .select();

            if (error) {
                statusDiv.className = 'text-center text-xs font-mono text-rose-400';
                statusDiv.innerText = currentLang === 'ru' ? 'Ошибка отправки: ' + error.message : 'Error: ' + error.message;
                btn.disabled = false;
                btn.innerText = currentLang === 'ru' ? 'Отправить заявку местным инспекторам' : 'Dispatch Request to Local Inspectors';
                return;
            }

            // 2. Уведомление в Telegram-бот
            const botToken = '9251200369:AAEs1Tuxt3smms34wrP30SbFyhy5-Ona9RY';
            const chatId = '247632305';
            const tgMessage = `⚡ *НОВАЯ ЗАЯВКА НА ИНСПЕКЦИЮ (SOURCEJET AI)* ⚡\n\n🏭 *Фабрика:* ${factoryVal} (${cityVal})\n📋 *Тип:* ${inspectionTypeVal}\n👤 *Компания:* ${clientNameVal}\n📝 *ТЗ:* ${notesVal || 'Стандарт'}`;

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: tgMessage, parse_mode: 'Markdown' })
                });
            } catch (err) {
                console.error('Telegram error:', err);
            }

            statusDiv.className = 'text-center text-xs font-mono text-emerald-400';
            statusDiv.innerText = currentLang === 'ru' ? '✓ Заявка успешно создана! Перенаправляем в Портал Импортера...' : '✓ Request created successfully! Redirecting to Importer Portal...';
            
            // 3. Автоматический переход в Портал Импортера ТОЛЬКО после отправки формы
            setTimeout(() => {
                window.location.href = 'importer_dashboard.html';
            }, 1500);
        });

        window.onload = () => {
            updateCities();
            switchLang(currentLang);
            
            const urlParams = new URLSearchParams(window.location.search);
            const factoryParam = urlParams.get('factory');
            if (factoryParam) {
                document.getElementById('factory_name').value = decodeURIComponent(factoryParam);
            }
        };
    </script>
</body>
</html>
