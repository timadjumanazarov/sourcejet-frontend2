<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspector Workspace — SourceJet AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .ai-gradient-text {
            background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.18);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-purple-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-purple-900/30 bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3.5">
                <div class="w-11 h-11 bg-gradient-to-tr from-purple-600 via-indigo-600 to-cyan-400 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-xl shadow-purple-500/25">⚡</div>
                <div>
                    <span class="font-black text-xl tracking-wider text-white">SourceJet <span class="ai-gradient-text">AI</span></span>
                    <p class="text-[9px] text-purple-400/90 font-bold tracking-widest uppercase">Inspector Terminal</p>
                </div>
            </a>
            
            <div class="flex items-center gap-2">
                <button id="lang-ru" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-purple-600 text-white">RU</button>
                <button id="lang-en" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-400">EN</button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-6xl mx-auto px-6 py-10 flex-1 w-full space-y-8">
        
        <!-- Filter Bar -->
        <div class="glass-panel p-6 rounded-3xl border border-purple-900/50 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-white" data-ru="Панель локального инспектора" data-en="Local Inspector Dashboard">Панель локального инспектора</h1>
                <p class="text-xs text-slate-400 mt-1" data-ru="Выберите ваш рабочий город для фильтрации заказов" data-en="Select your working location to filter tasks">Выберите ваш рабочий город для фильтрации заказов</p>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto">
                <select id="inspectorCity" class="bg-slate-950 border border-purple-900/60 rounded-xl px-4 py-2 text-xs font-bold text-cyan-300 focus:outline-none">
                    <option value="Yiwu">📍 Yiwu (Иу)</option>
                    <option value="Guangzhou">📍 Guangzhou (Гуанчжоу)</option>
                    <option value="Shenzhen">📍 Shenzhen (Шэньчжэнь)</option>
                    <option value="Foshan">📍 Foshan (Фошань)</option>
                    <option value="Ningbo">📍 Ningbo (Нинбо)</option>
                    <option value="Istanbul">📍 Istanbul (Стамбул)</option>
                </select>

                <button id="refreshBtn" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition">
                    🔄 <span data-ru="Обновить" data-en="Refresh">Обновить</span>
                </button>
            </div>
        </div>

        <!-- Orders Grid -->
        <div id="ordersList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Сюда подгружаются заказы из Supabase -->
        </div>

    </main>

    <footer class="border-t border-purple-900/30 bg-slate-900/80 py-8 text-center text-xs text-slate-500">
        <p>© 2026 SourceJet AI. Inspector Dispatch & Field Ops.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://ozpskokidbhqtoeykyzf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Zpkfm-iDWB7WuHrAp1jDtQ_1w_QU8s0';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentLang = 'ru';

        function switchLang(lang) {
            currentLang = lang;
            document.getElementById('lang-ru').className = lang === 'ru' ? 'px-2.5 py-1 rounded-lg text-xs font-bold bg-purple-600 text-white' : 'px-2.5 py-1 rounded-lg text-xs font-bold text-slate-400';
            document.getElementById('lang-en').className = lang === 'en' ? 'px-2.5 py-1 rounded-lg text-xs font-bold bg-purple-600 text-white' : 'px-2.5 py-1 rounded-lg text-xs font-bold text-slate-400';

            document.querySelectorAll('[data-ru]').forEach(el => {
                const text = el.getAttribute(`data-${lang}`);
                if (text) el.innerText = text;
            });

            loadOrders();
        }

        async function loadOrders() {
            const city = document.getElementById('inspectorCity').value;
            const container = document.getElementById('ordersList');

            container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-xs font-mono">${currentLang === 'ru' ? 'Загрузка заявок в регионе ' + city + '...' : 'Fetching orders for ' + city + '...'}</div>`;

            const { data, error } = await supabaseClient
                .from('inspections')
                .select('*')
                .eq('city', city)
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-rose-400 text-xs">Ошибка загрузки: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full glass-panel p-8 text-center rounded-3xl space-y-2">
                        <div class="text-2xl">📭</div>
                        <div class="text-sm font-bold text-slate-300">${currentLang === 'ru' ? 'Нет активных заявок' : 'No Active Inspection Requests'}</div>
                        <div class="text-xs text-slate-500">${currentLang === 'ru' ? 'В городе ' + city + ' пока нет доступных заказов.' : 'No orders available in ' + city + ' at the moment.'}</div>
                    </div>
                `;
                return;
            }

            let html = '';
            data.forEach(item => {
                const isSearching = item.status === 'searching_inspector';
                const statusBadge = isSearching 
                    ? `<span class="bg-amber-950 text-amber-400 border border-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full">${currentLang === 'ru' ? 'Свободный заказ' : 'Open Request'}</span>`
                    : `<span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full">${currentLang === 'ru' ? 'В работе' : 'In Progress'}</span>`;

                html += `
                    <div class="glass-panel p-6 rounded-3xl border border-purple-900/40 space-y-4 flex flex-col justify-between">
                        <div class="space-y-3">
                            <div class="flex justify-between items-start gap-2">
                                <div>
                                    <span class="text-[10px] font-mono text-purple-400 uppercase font-bold">${item.country} • ${item.city}</span>
                                    <h3 class="text-lg font-bold text-white mt-0.5">${item.factory_name}</h3>
                                </div>
                                ${statusBadge}
                            </div>

                            <div class="space-y-1.5 text-xs text-slate-300">
                                <p><strong>📍 Адрес:</strong> ${item.address_chinese || 'Не указан'}</p>
                                <p><strong>📅 Дата проверки:</strong> ${item.scheduled_date || 'По договоренности'}</p>
                                <p><strong>📋 Тип:</strong> <span class="text-cyan-400 font-bold">${item.inspection_type}</span></p>
                                <p><strong>👤 Клиент:</strong> ${item.client_name}</p>
                                ${item.requirements?.notes ? `<div class="bg-slate-950/80 p-3 rounded-xl text-slate-400 border border-purple-900/30 mt-2"><strong>ТЗ:</strong> ${item.requirements.notes}</div>` : ''}
                            </div>
                        </div>

                        <div class="pt-2">
                            ${isSearching ? `
                                <button onclick="claimOrder('${item.id}')" class="w-full bg-gradient-to-r from-purple-600 to-cyan-500 hover:opacity-90 text-white text-xs font-bold py-3 rounded-xl transition">
                                    ${currentLang === 'ru' ? 'Принять заказ на выезд' : 'Accept Inspection Task'}
                                </button>
                            ` : `
                                <button onclick="openChat('${item.id}')" class="w-full bg-slate-800 hover:bg-purple-900/60 text-white border border-purple-700/50 text-xs font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                                    💬 <span>${currentLang === 'ru' ? 'Открыть чат с клиентом' : 'Open Client Live Chat'}</span>
                                </button>
                            `}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function claimOrder(id) {
            const inspectorName = prompt(currentLang === 'ru' ? 'Введите ваше имя (Инспектор):' : 'Enter your name (Inspector):');
            if (!inspectorName) return;

            const { error } = await supabaseClient
                .from('inspections')
                .update({ 
                    status: 'in_progress',
                    inspector_name: inspectorName
                })
                .eq('id', id);

            if (error) {
                alert('Ошибка: ' + error.message);
            } else {
                alert(currentLang === 'ru' ? 'Заказ успешно принят вами в работу!' : 'Task claimed successfully!');
                loadOrders();
            }
        }

        function openChat(id) {
            alert(currentLang === 'ru' ? 'Переход в чат инспекции (Шаг 3)...' : 'Opening inspection live chat...');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lang-ru').addEventListener('click', () => switchLang('ru'));
            document.getElementById('lang-en').addEventListener('click', () => switchLang('en'));
            document.getElementById('inspectorCity').addEventListener('change', loadOrders);
            document.getElementById('refreshBtn').addEventListener('click', loadOrders);

            loadOrders();
        });
    </script>
</body>
</html>
