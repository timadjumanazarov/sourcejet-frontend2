<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspector Workspace — SourceJet AI</title>
    <!-- Фавиконка на вкладку браузера в виде векторного SVG-логотипа -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='sj-bg' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop stop-color='%236D28D9'/%3E%3Cstop offset='.55' stop-color='%234338CA'/%3E%3Cstop offset='1' stop-color='%230EA5E9'/%3E%3C/linearGradient%3E%3ClinearGradient id='sj-ribbon' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop stop-color='%23818CF8'/%3E%3Cstop offset='.5' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%2367E8F9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='19' fill='url(%23sj-bg)'/%3E%3Cpath d='M13 34C13 23 32 16 51 13 L35 27C29 31 21 32 13 34Z' fill='url(%23sj-ribbon)'/%3E%3Cpath d='M13 34C19 29 29 29 38 31 C47 33 51 37 48 42 C40 37 26 41 18 38 C15 37 13 36 13 34Z' fill='%2360A5FA'/%3E%3Cpath d='M48 40C47 47 29 53 12 56 L29 43C35 39 43 39 48 40Z' fill='url(%23sj-ribbon)'/%3E%3Cpath d='M46 15C49 12 53 12 54 14 C54 17 49 21 46 21 C43 21 43 18 46 15Z' fill='%2310B981'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .ai-gradient-text {
            background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.18);
        }

        /* Стили фирменного логотипа бренда */
        .sj-brand {
          display: inline-flex;
          align-items: center;
          gap: 16px;
          color: #fff;
          text-decoration: none;
        }

        .sj-brand__icon {
          display: block;
          width: 54px;
          height: 54px;
          flex-shrink: 0;
        }

        .sj-brand__copy {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }

        .sj-brand__name {
          font-weight: 900;
          font-size: 1.25rem;
          letter-spacing: 0.05em;
          color: #fff;
          line-height: 1;
        }

        .sj-brand__name span {
          background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #22d3ee 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .sj-brand__tagline {
          font-size: 8px;
          font-weight: 700;
          letter-spacing: 0.15em;
          color: #a855f7;
          line-height: 1.2;
          text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-purple-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-purple-900/30 bg-slate-900/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            
            <!-- Бренд-блок с вектором логотипа -->
            <a class="sj-brand" href="index.html" aria-label="SourceJet AI — Inspector Terminal">
              <svg
                class="sj-brand__icon"
                viewBox="0 0 64 64"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
              >
                <defs>
                  <linearGradient id="sj-bg" x1="0" y1="1" x2="1" y2="0">
                    <stop stop-color="#6D28D9"/>
                    <stop offset=".55" stop-color="#4338CA"/>
                    <stop offset="1" stop-color="#0EA5E9"/>
                  </linearGradient>

                  <linearGradient id="sj-ribbon" x1="0" y1="1" x2="1" y2="0">
                    <stop stop-color="#818CF8"/>
                    <stop offset=".5" stop-color="#3B82F6"/>
                    <stop offset="1" stop-color="#67E8F9"/>
                  </linearGradient>
                </defs>

                <rect width="64" height="64" rx="19" fill="url(#sj-bg)"/>

                <path
                  d="M13 34C13 23 32 16 51 13
                     L35 27C29 31 21 32 13 34Z"
                  fill="url(#sj-ribbon)"
                />

                <path
                  d="M13 34C19 29 29 29 38 31
                     C47 33 51 37 48 42
                     C40 37 26 41 18 38
                     C15 37 13 36 13 34Z"
                  fill="#60A5FA"
                />

                <path
                  d="M48 40C47 47 29 53 12 56
                     L29 43C35 39 43 39 48 40Z"
                  fill="url(#sj-ribbon)"
                />

                <path
                  d="M46 15C49 12 53 12 54 14
                     C54 17 49 21 46 21
                     C43 21 43 18 46 15Z"
                  fill="#10B981"
                />
              </svg>

              <span class="sj-brand__copy">
                <span class="sj-brand__name">
                  SourceJet <span>AI</span>
                </span>

                <span class="sj-brand__tagline" data-ru="Inspector Terminal" data-en="Inspector Terminal">
                  Inspector Terminal
                </span>
              </span>
            </a>
            
            <div class="flex items-center gap-2">
                <div class="bg-slate-900 border border-purple-900/50 rounded-xl p-1 flex items-center gap-1 text-xs font-bold">
                    <button onclick="switchLang('ru')" id="lang-ru" class="px-2.5 py-1 rounded-lg transition bg-purple-600 text-white cursor-pointer">RU</button>
                    <button onclick="switchLang('en')" id="lang-en" class="px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white cursor-pointer">EN</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-6xl mx-auto px-6 py-10 flex-1 w-full space-y-8">
        
        <!-- Верхние стат-карточки ("Горящие лампочки" / Аналитика) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass-panel p-5 rounded-3xl border border-purple-900/40 flex items-center gap-4">
                <div class="w-10 h-10 rounded-2xl bg-purple-950 border border-purple-800 flex items-center justify-center text-purple-400 font-black text-lg">📦</div>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase" data-ru="Всего заказов" data-en="Total Orders">Всего заказов</div>
                    <div id="statTotal" class="text-2xl font-black text-white mt-0.5">0</div>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-3xl border border-purple-900/40 flex items-center gap-4">
                <div class="w-10 h-10 rounded-2xl bg-amber-950 border border-amber-800 flex items-center justify-center text-amber-400 font-black text-lg">⚡</div>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase" data-ru="В процессе" data-en="In Progress">В процессе</div>
                    <div id="statInProgress" class="text-2xl font-black text-amber-400 mt-0.5">0</div>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-3xl border border-purple-900/40 flex items-center gap-4">
                <div class="w-10 h-10 rounded-2xl bg-emerald-950 border border-emerald-800 flex items-center justify-center text-emerald-400 font-black text-lg">✓</div>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase" data-ru="Выполнено" data-en="Completed">Выполнено</div>
                    <div id="statCompleted" class="text-2xl font-black text-emerald-400 mt-0.5">0</div>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-3xl border border-purple-900/40 flex items-center gap-4">
                <div class="w-10 h-10 rounded-2xl bg-cyan-950 border border-cyan-800 flex items-center justify-center text-cyan-400 font-black text-lg">🟢</div>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase" data-ru="Статус терминала" data-en="Terminal Status">Терминал</div>
                    <div class="text-sm font-black text-cyan-300 mt-1">Online</div>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="glass-panel p-6 rounded-3xl border border-purple-900/50 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-white" data-ru="Панель локального инспектора" data-en="Local Inspector Dashboard">Панель локального инспектора</h1>
                <p class="text-xs text-slate-400 mt-1" data-ru="Все активные заказы по инспекциям в Китае" data-en="All active inspection tasks in China">Все активные заказы по инспекциям в Китае</p>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto">
                <select id="inspectorCity" class="bg-slate-950 border border-purple-900/60 rounded-xl px-4 py-2 text-xs font-bold text-cyan-300 focus:outline-none">
                    <option value="all" data-ru="📍 Все города / All Cities" data-en="📍 All Cities">📍 Все города / All Cities</option>
                    <option value="Yiwu">📍 Yiwu (Иу)</option>
                    <option value="Guangzhou">📍 Guangzhou (Гуанчжоу)</option>
                    <option value="Shenzhen">📍 Shenzhen (Шэньчжэнь)</option>
                    <option value="Foshan">📍 Foshan (Фошань)</option>
                    <option value="Ningbo">📍 Ningbo (Нинбо)</option>
                </select>

                <button id="refreshBtn" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition cursor-pointer">
                    🔄 <span data-ru="Обновить" data-en="Refresh">Обновить</span>
                </button>
            </div>
        </div>

        <!-- Orders Grid -->
        <div id="ordersList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Сюда подгружаются заказы из Supabase -->
        </div>

    </main>

    <footer class="border-t border-purple-900/30 bg-slate-900/80 py-8 text-center text-xs text-slate-500">
        <p>© 2026 SourceJet AI. Inspector Dispatch & Field Ops.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://ozpskokidbhqtoeykyzf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Zpkfm-iDWB7WuHrAp1jDtQ_1w_QU8s0';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentLang = localStorage.getItem('sourcejet_lang') || 'ru';

        function switchLang(lang) {
            currentLang = lang;
            localStorage.setItem('sourcejet_lang', lang);

            document.getElementById('lang-ru').className = lang === 'ru' ? 'px-2.5 py-1 rounded-lg transition bg-purple-600 text-white font-bold cursor-pointer' : 'px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white cursor-pointer';
            document.getElementById('lang-en').className = lang === 'en' ? 'px-2.5 py-1 rounded-lg transition bg-purple-600 text-white font-bold cursor-pointer' : 'px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white cursor-pointer';

            document.querySelectorAll('[data-ru]').forEach(el => {
                const text = el.getAttribute(`data-${lang}`);
                if (text) el.innerText = text;
            });

            loadOrders();
        }

        async function loadOrders() {
            const container = document.getElementById('ordersList');
            container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-10">${currentLang === 'ru' ? 'Загрузка всех заказов из базы...' : 'Loading all orders from database...'}</div>`;

            const selectedCity = document.getElementById('inspectorCity').value;

            let query = supabaseClient.from('inspections').select('*').order('created_at', { ascending: false });
            
            if (selectedCity && selectedCity !== 'all') {
                query = query.eq('city', selectedCity);
            }

            const { data, error } = await query;

            if (error) {
                container.innerHTML = `<div class="col-span-full text-center text-rose-400 py-10">Ошибка: ${error.message}</div>`;
                return;
            }

            // Обновляем верхние счетчики
            if (data) {
                document.getElementById('statTotal').innerText = data.length;
                document.getElementById('statInProgress').innerText = data.filter(i => i.status === 'in_progress').length;
                document.getElementById('statCompleted').innerText = data.filter(i => i.status === 'completed' || i.status === 'inspected').length;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-10">${currentLang === 'ru' ? 'В базе данных пока нет ни одной заявки для выбранного города.' : 'No inspection requests found for the selected city.'}</div>`;
                return;
            }

            let html = '';
            data.forEach(order => {
                const isInProgress = order.status === 'in_progress' || order.status === 'completed';

                const cityLabel = currentLang === 'ru' ? 'Город' : 'City';
                const addressLabel = currentLang === 'ru' ? '📍 Адрес' : '📍 Address';
                const dateLabel = currentLang === 'ru' ? '📅 Дата проверки' : '📅 Inspection Date';
                const productLabel = currentLang === 'ru' ? '📋 Товар' : '📋 Product';
                const clientLabel = currentLang === 'ru' ? '👤 Клиент' : '👤 Client';
                const notSpecified = currentLang === 'ru' ? 'Не указан' : 'Not specified';
                const standardText = currentLang === 'ru' ? 'Стандарт' : 'Standard';
                const btnInspectText = currentLang === 'ru' ? 'В комнату инспекции' : 'Enter Inspection Room';
                const btnClaimText = currentLang === 'ru' ? 'Принять заказ на выезд' : 'Claim Inspection Order';

                html += `
                    <div class="glass-panel p-6 rounded-3xl border ${isInProgress ? 'border-amber-500/40' : 'border-purple-900/40'} space-y-4 flex flex-col justify-between">
                        <div class="space-y-3">
                            <div class="flex justify-between items-start gap-2">
                                <div>
                                    <span class="text-[10px] font-mono text-purple-400 uppercase font-bold">${cityLabel}: ${order.city || 'Китай'}</span>
                                    <h3 class="text-lg font-bold text-white mt-0.5">${order.factory_name || 'Фабрика'}</h3>
                                </div>
                                <span class="text-[10px] px-2.5 py-1 rounded-full font-bold uppercase ${isInProgress ? 'bg-amber-950 text-amber-300 border border-amber-800' : 'bg-purple-950 text-purple-300 border border-purple-800'}">
                                    ${order.status || 'new'}
                                </span>
                            </div>

                            <div class="space-y-1.5 text-xs text-slate-300">
                                <p><strong>${addressLabel}:</strong> ${order.address || order.address_chinese || notSpecified}</p>
                                <p><strong>${dateLabel}:</strong> ${order.scheduled_date || (currentLang === 'ru' ? 'По договоренности' : 'As agreed')}</p>
                                <p><strong>${productLabel}:</strong> <span class="text-cyan-400 font-bold">${order.product_name || standardText}</span></p>
                                <p><strong>${clientLabel}:</strong> ${order.client_name || notSpecified}</p>
                                <p class="text-[10px] text-slate-500 font-mono">ID: ${order.id}</p>
                            </div>
                        </div>

                        <div class="pt-2">
                            ${isInProgress ? `
                                <button onclick="openChat('${order.id}')" class="w-full bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-3 rounded-xl uppercase tracking-wider transition flex items-center justify-center gap-2 shadow-lg cursor-pointer">
                                    💬 <span>${btnInspectText}</span>
                                </button>
                            ` : `
                                <button onclick="claimOrder('${order.id}')" class="w-full bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold py-3 rounded-xl uppercase tracking-wider transition shadow-lg cursor-pointer">
                                    ${btnClaimText}
                                </button>
                            `}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function claimOrder(id) {
            try {
                await supabaseClient
                    .from('inspections')
                    .update({ 
                        status: 'in_progress',
                        inspector_name: currentLang === 'ru' ? 'Китайский инспектор' : 'PRC Inspector'
                    })
                    .eq('id', id);
            } catch (err) {
                console.warn("Update notice:", err);
            }
            window.location.href = `inspection_room.html?id=${id}`;
        }

        function openChat(id) {
            window.location.href = `inspection_room.html?id=${id}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            switchLang(currentLang);
            document.getElementById('inspectorCity').addEventListener('change', loadOrders);
            document.getElementById('refreshBtn').addEventListener('click', loadOrders);
        });
    </script>
</body>
</html>
